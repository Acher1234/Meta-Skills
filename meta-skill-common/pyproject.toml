[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-skill-common"
version = "0.1.0"
description = "Shared helpers for Meta-Skills (importable as ``common``)"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = { "common" = "." }
packages = ["common"]
